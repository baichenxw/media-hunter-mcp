[project]
name = "media-hunter-mcp"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "搜索并下载 e621 / rule34 / E-Hentai / pixiv 资源的 MCP 服务器"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.5,<4",
    "httpx[socks]>=0.28.1,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
media-mcp = "media_mcp.server:main"
media-hunter = "media_mcp.cli:main"

[project.optional-dependencies]
animation = ["imageio-ffmpeg>=0.6,<1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/config.example.toml", "/pyproject.toml", "/uv.lock", "/docs/refactor-2026-09-09.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
